name: Release

# Pushing a tag is the release.
#
#   npm version patch     bumps package.json, commits, tags v0.1.1
#   git push --follow-tags
#
# Everything below then happens on its own, and stops one click short of done:
# the installers and the zip are uploaded to a *draft* release, which a person
# publishes after looking at what arrived. Nothing is signed (see PLAN.md §5.5),
# so what is worth looking at is that both platforms produced what they should.
#
# `workflow_dispatch` runs the same build without publishing anything, and
# leaves the installers and the zip as workflow artifacts. That is how to prove
# a change to this file before trusting it with a tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # electron-builder downloads Electron itself; a cache would be a second thing
  # that could be stale, for a download that happens twice a release.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

jobs:
  installers:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide what the other would have said.
      fail-fast: false
      matrix:
        # No macos-latest: an unsigned macOS build is not something this project
        # would publish, so there is nothing for that runner to make. PLAN.md
        # §5.5 has the reasoning and what a contributor with the licence needs.
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The committed lockfile pins registry.npmjs.org, which is what lets this
      # run anywhere at all — see PLAN.md §0.
      - name: Install
        run: npm ci

      # --with-deps installs system libraries and is Ubuntu-only; asking for it
      # on Windows is a way to fail before anything has been built.
      - name: Install the browser Playwright drives
        run: npx playwright install chromium
        if: runner.os == 'Windows'

      - name: Install the browser Playwright drives
        run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'

      # Cheap, offline, and catches the class of bug that only shows up when a
      # visitor clicks: a docs link the website will serve as raw markdown.
      - name: Check the docs links
        run: npm run check:docs

      # The release notes page on the website is generated from CHANGELOG.md,
      # and the website serves what is committed. A changelog edited without
      # regenerating it would put out a release whose notes page is the last
      # version's, so this fails here rather than after anyone has read it.
      - name: Check the release notes page
        run: npm run check:notes

      - name: Unit tests
        run: npm test

      - name: Build the app
        run: npm run build

      # Includes the desktop spec, which starts the Electron shell for real:
      # its own server, its own port, its documents in a profile of their own.
      # Linux runners have no display, hence xvfb.
      - name: End-to-end tests
        run: npm run e2e:quick
        if: runner.os == 'Windows'

      - name: End-to-end tests
        run: xvfb-run --auto-servernum npm run e2e:quick
        if: runner.os == 'Linux'

      - name: Build the installers
        run: node tools/desktop.mjs --dist ${{ startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The third way in, for a machine that has Node and would rather have one
      # megabyte than a hundred — and the only way in on a Mac. It is zipped
      # from the folder the installers were just built from, so the two channels
      # are the same server, the same app and the same dependencies by
      # construction rather than by promise.
      #
      # Linux only: one zip is enough, and it has to be made on a Unix runner —
      # the archive carries the file modes of the machine that wrote it, and
      # start.sh has to arrive runnable.
      - name: Build the zip
        if: runner.os == 'Linux'
        run: |
          node tools/package.mjs --stage build/desktop-stage --zip-only
          mv build/lamplit-*.zip build/Lamplit.zip

      # Unversioned, like the installers, so that
      # releases/latest/download/Lamplit.zip stays a link forever. The version
      # is inside, in package.json and README.txt.
      - name: Put the zip on the draft release
        if: ${{ runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v') }}
        run: gh release upload "${GITHUB_REF_NAME}" build/Lamplit.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installers when nothing was published
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            build/desktop/*.exe
            build/desktop/*.AppImage
            build/desktop/*.deb
          if-no-files-found: error

      - name: Keep the zip when nothing was published
        if: ${{ runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: zip
          path: build/Lamplit.zip
          if-no-files-found: error

  notes:
    name: Release notes
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The changelog is written by hand and is the release notes; this only
      # takes the top section of it, so there is one place to write them.
      - name: Take the top section of CHANGELOG.md
        run: |
          awk '/^## /{ if (seen++) exit } seen' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section to publish"; exit 1; }
          cat notes.md

      - name: Put them on the draft release
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
