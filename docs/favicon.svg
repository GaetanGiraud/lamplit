<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="Lamplit">
  <title>Lamplit</title>
  <!--
    An open book, in the app's own accent on the app's own surface. The glyph is
    Lucide's "book-open-text" (ISC — see NOTICE), restroked for the sizes a
    favicon is actually looked at: 2.4 units on the 24-grid still reads at 16px,
    where the 2 it ships with turns to grey mush.
  -->
